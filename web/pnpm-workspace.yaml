# pnpm settings for the Lucid frontend (NFR-30: supply-chain hardening).
#
# Dependency lifecycle scripts are blocked by default. None are currently
# needed: Vite 8 (rolldown), Tailwind (oxide) and lightningcss ship prebuilt
# platform binaries as optional dependencies. Add a package here only after
# reviewing its install script.
allowBuilds: {}
# Fail the install if a dependency wants to run a build script that has not
# been reviewed above, instead of silently skipping it.
strictDepBuilds: true
# Refuse to install on unsupported Node versions (see package.json engines).
engineStrict: true

# Policies for every newly resolved version, direct or transitive. pnpm also
# re-checks the committed lockfile against them on every install.
#
# Skip versions published less than a day ago (pnpm's default age). Strict:
# fail when only a younger version fits instead of adding an exclusion.
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
# Refuse a version with weaker publish provenance than an earlier release,
# the typical trace of a stolen publish token. Only versions younger than 30
# days are checked: takeovers are caught within days, while older history
# (backports, one-off manual releases) only produces false alarms.
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200
