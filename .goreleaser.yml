project_name: lucid
version: 2

before:
  hooks:
    - go mod download
    - go mod tidy

builds:
  - id: lucid
    main: ./cmd/lucid
    binary: lucid
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: tar.gz
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    files:
      - README.md
      - LICENSE

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

release:
  github:
    owner: tbckr
    name: lucid
  draft: false
  prerelease: false
  name_template: 'v{{.Version}}'
  footer: |
    ## Installation
    
    ### Docker
    ```bash
    docker run -p 8080:8080 ghcr.io/tbckr/lucid:{{ .Version }}
    ```
    
    ### Binary
    Download from the assets below.

dockers:
  - image_templates:
      - 'ghcr.io/tbckr/lucid:{{ .Version }}'
      - 'ghcr.io/tbckr/lucid:latest'
    dockerfile: Dockerfile
    build_flag_templates:
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.name={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"

sboms:
  - artifacts: archive
    documents:
      - '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.sbom.spdx.json'
