# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 configuration for Lucid (NFR-13/14/15).
#
# Local dry run (no publishing, no signing):
#   goreleaser release --snapshot --clean --skip=sign,sbom
version: 2

project_name: lucid

# release.yml skips these hooks (--skip=before) and runs them in a job without
# write access, so no dependency code runs next to the signing identity.
before:
  hooks:
    - go mod download
    - go mod verify
    # Build the SPA so web/embed.go embeds it into every binary.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  - id: lucid
    main: ./cmd/lucid
    binary: lucid
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible builds: file timestamps follow the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: lucid
    ids:
      - lucid
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - SECURITY.md

# Linux packages (NFR-35): deb, rpm and Arch, attached to the release like the
# archives, with no package repository. checksums.txt lists them, so the
# cosign signature and the provenance attestation cover them too. No SBOM of
# their own: each holds the binary of its platform's archive, which has one.
# Server mode runs as a hardened system service that the packages install
# but do not enable; the menu entry starts local mode (FR-35) in a terminal.
nfpms:
  - id: lucid
    ids:
      - lucid
    package_name: lucid
    maintainer: Tim <11543666+tbckr@users.noreply.github.com>
    description: Modern CalDAV web client for calendars and tasks
    homepage: https://github.com/tbckr/lucid
    license: GPL-3.0-only
    section: web
    formats:
      - deb
      - rpm
      - archlinux
    # Local mode opens the browser with xdg-open. A weak dependency for deb
    # and rpm; nfpm has no equivalent for Arch.
    recommends:
      - xdg-utils
    contents:
      - src: packaging/lucid.service
        dst: /usr/lib/systemd/system/lucid.service
      - src: packaging/lucid.env
        dst: /etc/lucid/lucid.env
        type: config|noreplace
        file_info:
          mode: 0640
      - src: packaging/lucid.desktop
        dst: /usr/share/applications/lucid.desktop
      - src: web/public/favicon.svg
        dst: /usr/share/icons/hicolor/scalable/apps/lucid.svg
      - src: LICENSE
        dst: /usr/share/licenses/lucid/LICENSE
        type: license
        packager: rpm
      - src: LICENSE
        dst: /usr/share/licenses/lucid/LICENSE
        packager: archlinux
      - src: LICENSE
        dst: /usr/share/doc/lucid/copyright
        packager: deb
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh
      postremove: packaging/scripts/postremove.sh
    archlinux:
      packager: Tim <11543666+tbckr@users.noreply.github.com>
      scripts:
        # pacman runs only post_upgrade on an upgrade.
        postupgrade: packaging/scripts/postinstall.sh
    overrides:
      archlinux:
        # Without an epoch nfpm drops the pre-release part from pkgver
        # (1.2.3-rc.1 would become 1.2.3-1). pacman treats epoch 0 as none.
        epoch: "0"

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive, generated with syft (NFR-15).
sboms:
  - id: archive-sbom
    artifacts: archive

# Keyless (OIDC) cosign signature of the checksum file. Verifying the
# checksum file transitively covers every archive and SBOM listed in it.
signs:
  - id: cosign-checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

# Multi-arch container images (linux/amd64, linux/arm64) built with buildx
# from ./Dockerfile. The build context contains the prebuilt binary at
# $TARGETPLATFORM/lucid.
dockers_v2:
  - id: lucid
    ids:
      - lucid
    dockerfile: Dockerfile
    images:
      - ghcr.io/tbckr/lucid
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # BuildKit SBOM attestation attached to the image index.
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Modern CalDAV web client for calendars and tasks"
      org.opencontainers.image.url: "https://github.com/tbckr/lucid"
      org.opencontainers.image.source: "https://github.com/tbckr/lucid"
      org.opencontainers.image.documentation: "https://github.com/tbckr/lucid#readme"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: "GPL-3.0-only"
    annotations:
      org.opencontainers.image.description: "Modern CalDAV web client for calendars and tasks"
      org.opencontainers.image.source: "https://github.com/tbckr/lucid"
      org.opencontainers.image.licenses: "GPL-3.0-only"

# Keyless cosign signatures for the pushed images (signed by digest).
docker_signs:
  - id: cosign-images
    cmd: cosign
    artifacts: all
    args:
      - sign
      - ${artifact}@${digest}
      - --yes
    output: true

changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"
      - "^ci(\\(.*\\))?:"
      - "^style(\\(.*\\))?:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 10
    - title: Security
      regexp: '^.*?sec(urity)?(\(.+\))?:.+$'
      order: 20
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:.+$'
      order: 30
    - title: Performance
      regexp: '^.*?perf(\(.+\))?:.+$'
      order: 40
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))?:.+$'
      order: 50
    - title: Dependencies
      regexp: '^.*?(build|deps)(\(.+\))?:.+$'
      order: 60
    - title: Other changes
      order: 999

release:
  github:
    owner: tbckr
    name: lucid
  prerelease: auto
  # Immutable releases (a repository setting) lock the tag and the assets
  # once a release is published. GoReleaser therefore only creates a draft,
  # and release.yml publishes it as its last step, after the attestations.
  # A re-run replaces the draft of a failed run instead of adding another.
  draft: true
  replace_existing_draft: true
  mode: replace
  footer: |
    ## Verifying this release

    ```sh
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github\.com/tbckr/lucid/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt

    cosign verify ghcr.io/tbckr/lucid:{{ .Version }} \
      --certificate-identity-regexp '^https://github\.com/tbckr/lucid/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
