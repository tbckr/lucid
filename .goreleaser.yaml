# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# GoReleaser v2 configuration for Lucid (NFR-13/14/15).
#
# Local dry run (no publishing, no signing):
#   goreleaser release --snapshot --clean --skip=sign,sbom
version: 2

project_name: lucid

before:
  hooks:
    - go mod download
    - go mod verify
    # Build the SPA so web/embed.go embeds it into every binary.
    - pnpm --dir web install --frozen-lockfile
    - pnpm --dir web build

builds:
  - id: lucid
    main: ./cmd/lucid
    binary: lucid
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    # Reproducible builds: file timestamps follow the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: lucid
    ids:
      - lucid
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md
      - SECURITY.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

# SPDX SBOM per archive, generated with syft (NFR-15).
sboms:
  - id: archive-sbom
    artifacts: archive

# Keyless (OIDC) cosign signature of the checksum file. Verifying the
# checksum file transitively covers every archive and SBOM listed in it.
signs:
  - id: cosign-checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    output: true

# Multi-arch container images (linux/amd64, linux/arm64) built with buildx
# from ./Dockerfile. The build context contains the prebuilt binary at
# $TARGETPLATFORM/lucid.
dockers_v2:
  - id: lucid
    ids:
      - lucid
    dockerfile: Dockerfile
    images:
      - ghcr.io/tbckr/lucid
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}{{ .Major }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    # BuildKit SBOM attestation attached to the image index.
    sbom: true
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "Modern CalDAV web client for calendars and tasks"
      org.opencontainers.image.url: "https://github.com/tbckr/lucid"
      org.opencontainers.image.source: "https://github.com/tbckr/lucid"
      org.opencontainers.image.documentation: "https://github.com/tbckr/lucid#readme"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: "GPL-3.0-only"
    annotations:
      org.opencontainers.image.description: "Modern CalDAV web client for calendars and tasks"
      org.opencontainers.image.source: "https://github.com/tbckr/lucid"
      org.opencontainers.image.licenses: "GPL-3.0-only"

# Keyless cosign signatures for the pushed images (signed by digest).
docker_signs:
  - id: cosign-images
    cmd: cosign
    artifacts: all
    args:
      - sign
      - ${artifact}@${digest}
      - --yes
    output: true

changelog:
  use: github
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - "^docs(\\(.*\\))?:"
      - "^test(\\(.*\\))?:"
      - "^chore(\\(.*\\))?:"
      - "^ci(\\(.*\\))?:"
      - "^style(\\(.*\\))?:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: Breaking changes
      regexp: '^.*?\w+(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))?:.+$'
      order: 10
    - title: Security
      regexp: '^.*?sec(urity)?(\(.+\))?:.+$'
      order: 20
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))?:.+$'
      order: 30
    - title: Performance
      regexp: '^.*?perf(\(.+\))?:.+$'
      order: 40
    - title: Refactoring
      regexp: '^.*?refactor(\(.+\))?:.+$'
      order: 50
    - title: Dependencies
      regexp: '^.*?(build|deps)(\(.+\))?:.+$'
      order: 60
    - title: Other changes
      order: 999

release:
  github:
    owner: tbckr
    name: lucid
  prerelease: auto
  draft: false
  mode: replace
  footer: |
    ## Verifying this release

    ```sh
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp '^https://github\.com/tbckr/lucid/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt

    cosign verify ghcr.io/tbckr/lucid:{{ .Version }} \
      --certificate-identity-regexp '^https://github\.com/tbckr/lucid/\.github/workflows/release\.yml@refs/tags/v' \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com
    ```
