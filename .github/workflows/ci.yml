# Continuous integration (NFR-05/06/10/11/12/28/30/31).
#
# Actions are referenced by version tag here; Renovate
# (helpers:pinGitHubActionDigests) rewrites them to full commit SHAs with a
# "# vX.Y.Z" comment and keeps them updated.
name: CI

# Changes that touch only files no job reads (docs, dev tooling) skip CI.
# Keep both lists in sync with codeql.yml. Caveat: a workflow skipped by
# paths-ignore never reports its checks, so a required status check would
# stay pending; switch to job-level filtering before making jobs required.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - justfile
      - compose.yaml
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - justfile
      - compose.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # renovate: datasource=github-releases depName=golangci/golangci-lint
  GOLANGCI_LINT_VERSION: v2.12.2
  # renovate: datasource=go depName=golang.org/x/vuln
  GOVULNCHECK_VERSION: v1.1.4
  NODE_VERSION: "24"

jobs:
  go:
    name: Go (build, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify modules are tidy
        run: |
          go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test (race detector, coverage)
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate (>= 80% business logic, NFR-05)
        run: scripts/coverage-gate.sh coverage.out

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  go-lint:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # only-new-issues annotations on PRs
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  go-vuln:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: govulncheck (NFR-11)
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...

  frontend:
    name: Frontend (audit, lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install (frozen lockfile, NFR-30)
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (NFR-30)
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: No source maps or env leakage in bundle (NFR-31)
        run: |
          maps="$(find dist -type f -name '*.map')"
          if [ -n "$maps" ]; then
            echo "::error::Source maps must not be shipped (NFR-31):"
            echo "$maps"
            exit 1
          fi
          if grep -rl 'sourceMappingURL=' dist; then
            echo "::error::Bundle references source maps (NFR-31)"
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  binary:
    name: Single binary (embedded frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Download dist
        uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: web/dist

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=0.0.0-ci -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o bin/lucid ./cmd/lucid

      - name: Smoke test
        env:
          LUCID_ADDR: 127.0.0.1:8080
        run: |
          ./bin/lucid --version
          ./bin/lucid &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          ./bin/lucid healthcheck
          curl -fsS http://127.0.0.1:8080/readyz
          # The embedded SPA must be served (not the placeholder).
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<script' \
            || { echo "::error::embedded frontend not served"; exit 1; }

      - name: Validate GoReleaser config
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: lucid-linux-amd64
          path: bin/lucid
          retention-days: 7

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
