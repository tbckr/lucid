# Continuous integration (NFR-05/06/10/11/12/28/30/31).
#
# Dependency audits run in vuln.yml (main) and vuln-release.yml (latest
# release), CI against the latest direct dependencies in latest-deps.yml.
#
# Actions are pinned to full commit SHAs with a "# vX.Y.Z" comment;
# Dependabot (.github/dependabot.yml) bumps them monthly.
name: CI

# Changes that touch only files no job reads (docs, dev tooling) skip CI.
# Nix files are checked by nix.yml instead.
# Keep both lists in sync with codeql.yml. Caveat: a workflow skipped by
# paths-ignore never reports its checks, so a required status check would
# stay pending; switch to job-level filtering before making jobs required.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - justfile
      - scripts/release.sh
      - compose.yaml
      - flake.nix
      - flake.lock
      - .envrc
      - "nix/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - justfile
      - scripts/release.sh
      - compose.yaml
      - flake.nix
      - flake.lock
      - .envrc
      - "nix/**"
  workflow_dispatch:
  # release.yml runs this workflow on every release tag, where paths-ignore
  # does not apply.
  workflow_call:

permissions:
  contents: read

# A fixed prefix, not github.workflow: in a run called by release.yml,
# github.workflow names the caller, and sharing its group would deadlock.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bumped by hand when upgrading dependencies (`just outdated` shows the
  # latest release).
  GOLANGCI_LINT_VERSION: v2.12.2
  # The version release.yml releases with; keep both in sync.
  GORELEASER_VERSION: v2.18.2
  NODE_VERSION: "24"

jobs:
  go:
    name: Go (build, test, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Verify modules are tidy
        run: |
          go mod tidy -diff

      - name: Build
        run: go build ./...

      - name: Test (race detector, coverage)
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage gate (>= 80% business logic, NFR-05)
        run: scripts/coverage-gate.sh coverage.out

      - name: Upload coverage profile
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 14

  go-lint:
    name: Go (golangci-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # only-new-issues annotations on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  go-vuln:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Runs on every change: whether vulnerable code is reachable depends on
      # our code, not only on the dependencies (NFR-11).
      - name: govulncheck (NFR-11)
        uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810 # v1.2.2
        with:
          run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install (frozen lockfile, NFR-30)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: No source maps or env leakage in bundle (NFR-31)
        run: |
          maps="$(find dist -type f -name '*.map')"
          if [ -n "$maps" ]; then
            echo "::error::Source maps must not be shipped (NFR-31):"
            echo "$maps"
            exit 1
          fi
          if grep -rl 'sourceMappingURL=' dist; then
            echo "::error::Bundle references source maps (NFR-31)"
            exit 1
          fi

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  binary:
    name: Single binary (embedded frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist

      # No version ldflags: the smoke test's --version shows what the binary
      # reads from the build info Go records.
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -ldflags "-s -w" -o bin/lucid ./cmd/lucid

      - name: Smoke test
        env:
          LUCID_ADDR: 127.0.0.1:8080
        run: |
          ./bin/lucid --version
          ./bin/lucid &
          pid=$!
          trap 'kill "$pid"' EXIT
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.5
          done
          ./bin/lucid healthcheck
          curl -fsS http://127.0.0.1:8080/readyz
          # The embedded SPA must be served (not the placeholder).
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<script' \
            || { echo "::error::embedded frontend not served"; exit 1; }

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lucid-linux-amd64
          path: bin/lucid
          retention-days: 7

  # Catches a broken .goreleaser.yaml on the pull request, not only after a
  # release tag is pushed. `goreleaser check` only reads the config, so the
  # job needs neither Go nor the frontend.
  goreleaser-check:
    name: GoReleaser (config check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

  # Vulnerabilities and licenses (OSI-approved only) of the dependencies a
  # pull request or a push to main adds or updates. On a push the check runs
  # after the fact: a failure means main needs a follow-up commit. The policy
  # is in the config file; policy inputs set here would override it.
  # Skipped for release tags (release.yml): a called workflow sees the
  # caller's push event, but a new tag has no previous commit to compare.
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml
          # A push has no default refs. On pull requests both stay empty:
          # explicit refs would take precedence over the pull request's own.
          base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
