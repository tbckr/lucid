# Vulnerability scans of main (NFR-11/30), daily and whenever the dependency
# manifests change. Only precise signals fail the run (see "Updating
# dependencies" in CONTRIBUTING.md):
#   - govulncheck reports only vulnerabilities whose code is reachable.
#   - pnpm audit --prod covers only the packages shipped in the bundle: a
#     vulnerability needs attacker input, and build and test tools only
#     process our own code.
#   - Malware is different: it does harm wherever it runs. Build tools run
#     on developer machines and in CI, and they write the bundle, so known
#     malware (CWE-506) fails the run for every package, devDependencies
#     included.
#   - Grype on the distroless base image the Dockerfile references by tag,
#     as the next release would ship it. The tag moves upstream, not with our
#     commits, so only the daily and manual runs scan it. Only high or
#     critical vulnerabilities that have a fix fail it.
# ci.yml also runs govulncheck on every change to Go code; vuln-release.yml
# scans the latest release.
#
# Actions are pinned to full commit SHAs with a "# vX.Y.Z" comment;
# Dependabot (.github/dependabot.yml) bumps them monthly.
name: Vulnerabilities

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - web/package.json
      - web/pnpm-lock.yaml
      - web/pnpm-workspace.yaml
      - scripts/deps.sh
      - .github/workflows/vuln.yml
  pull_request:
    paths:
      - go.mod
      - go.sum
      - web/package.json
      - web/pnpm-lock.yaml
      - web/pnpm-workspace.yaml
      - scripts/deps.sh
      - .github/workflows/vuln.yml
  schedule:
    - cron: "22 5 * * *" # daily, 05:22 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  govulncheck:
    name: govulncheck (main)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: geomys/sandboxed-step@a6bfc174e532cea4f378e3427bcde8b714c2e810 # v1.2.2
        with:
          run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  pnpm-audit:
    name: pnpm audit (vulnerabilities in shipped packages, malware in all)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Both steps read the lockfile only; nothing is installed.
      - name: Vulnerabilities in shipped packages (NFR-30)
        run: pnpm --dir web audit --prod

      - name: Malware in any package, devDependencies included
        if: ${{ !cancelled() }}
        run: scripts/deps.sh malware

  # Next to the Grype job in vuln-release.yml: a finding there that is gone
  # here needs only a new release; one that shows up here too waits for
  # distroless.
  grype-base:
    name: Grype (base image)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Base image from the Dockerfile
        id: base
        run: |
          image="$(sed -nE 's/^FROM (.+)/\1/p' Dockerfile)"
          if [ -z "$image" ]; then
            echo "::error::no FROM line in the Dockerfile"
            exit 1
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ steps.base.outputs.image }}
          config: .github/grype-config.yml
          output-format: table
          severity-cutoff: high
          only-fixed: true
