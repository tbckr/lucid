# Release pipeline (NFR-13/14/15, PRD phase 4 "Release Hardening").
#
# Triggered by pushing a SemVer tag (vMAJOR.MINOR.PATCH[-PRERELEASE]).
# The full CI (ci.yml) checks the tagged commit while a read-only job builds
# the frontend. Once both pass, GoReleaser builds the binaries with that
# frontend embedded, archives,
# checksums, SBOMs (syft), multi-arch images on ghcr.io and signs the checksum
# file and the images keylessly with cosign (GitHub OIDC). The GitHub release
# stays a draft until SLSA build provenance is attested; publishing it is the
# last step, because an immutable release can no longer change. Afterwards
# the published image is scanned with Grype; vuln-release.yml rescans the
# latest release daily.
#
# Actions are pinned to full commit SHAs with a "# vX.Y.Z" comment;
# Dependabot (.github/dependabot.yml) bumps them monthly. Pinning matters
# most here: this workflow can publish releases and sign them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tbckr/lucid
  NODE_VERSION: "24"
  # An exact version, not a range: GoReleaser runs in the job that can
  # publish and sign. Bumped by hand together with ci.yml (`just outdated`
  # shows the latest release).
  GORELEASER_VERSION: v2.18.2

jobs:
  # The whole CI on exactly the tagged commit, however the tag was pushed.
  # Its jobs restore caches; that is fine, since none of their output ends
  # up in the release.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read # requested by ci.yml's go-lint job

  # Everything that runs dependency code (the tests in the ci job, pnpm
  # install and the Vite build here) runs without write access or an OIDC
  # token: a compromised build tool cannot sign or publish. The goreleaser
  # job only builds the Go binary, which runs no dependency code, and
  # packages, signs and uploads.
  build:
    name: Frontend build (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Validate SemVer tag (NFR-14)
        id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $re ]]; then
            echo "::error::tag '$tag' is not a SemVer tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The same steps as the before hooks in .goreleaser.yaml, which the
      # goreleaser job skips.
      - name: Build the frontend (frozen lockfile, NFR-30)
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      # Not web-dist: the ci job uploads that name into the same run, built
      # with caches.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: GoReleaser
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release
      packages: write # push images to ghcr.io
      id-token: write # cosign keyless signing + attestations
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changelog needs full history and tags
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache into a release build

      - name: Download the frontend build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-web-dist
          path: web/dist

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # The build job ran the before hooks and built web/dist.
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest provenance of release archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Resolve image digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ needs.build.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest provenance of container image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # GoReleaser created a draft (.goreleaser.yaml). Once published, an
      # immutable release keeps its tag and assets, so this runs last.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # Only the packages of the distroless base image count
  # (.github/grype-config.yml): the binary in it passed govulncheck in the ci
  # job before it was built.
  scan-image:
    name: Container scan (Grype)
    needs: [build, goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify image signature
        run: |
          cosign verify "${IMAGE}:${{ needs.build.outputs.version }}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Grype scan (SARIF)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          config: .github/grype-config.yml
          output-format: sarif
          fail-build: false
          only-fixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      # Reuses the grype binary from the tool cache and the local DB.
      - name: Fail on critical/high vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          config: .github/grype-config.yml
          output-format: table
          severity-cutoff: high
          only-fixed: true
