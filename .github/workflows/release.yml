# Release pipeline (NFR-13/14/15, PRD phase 4 "Release Hardening").
#
# Triggered by pushing a SemVer tag (vMAJOR.MINOR.PATCH[-PRERELEASE]).
# The full CI (ci.yml) checks the tagged commit while a read-only job builds
# the frontend. Once both pass, GoReleaser builds the binaries with that
# frontend embedded, archives,
# checksums, SBOMs (syft), multi-arch images on ghcr.io and signs the checksum
# file and the images keylessly with cosign (GitHub OIDC). The GitHub release
# stays a draft until SLSA build provenance is attested; publishing it is the
# last step, because an immutable release can no longer change. Afterwards
# the published image is scanned with Grype; vuln-release.yml rescans the
# latest release daily.
#
# Actions are pinned to full commit SHAs with a "# vX.Y.Z" comment;
# Dependabot (.github/dependabot.yml) bumps them monthly. Pinning matters
# most here: this workflow can publish releases and sign them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tbckr/lucid
  NODE_VERSION: "24"
  # An exact version, not a range: GoReleaser runs in the job that can
  # publish and sign. Bumped by hand together with ci.yml (`just outdated`
  # shows the latest release).
  GORELEASER_VERSION: v2.18.2

jobs:
  # The whole CI on exactly the tagged commit, however the tag was pushed.
  # Its jobs restore caches; that is fine, since none of their output ends
  # up in the release.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read # requested by ci.yml's go-lint job

  # Everything that runs dependency code (the tests in the ci job, pnpm
  # install and the Vite build here) runs without write access or an OIDC
  # token: a compromised build tool cannot sign or publish. The goreleaser
  # job only builds the Go binary, which runs no dependency code, and
  # packages, signs and uploads.
  build:
    name: Frontend build (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Validate SemVer tag (NFR-14)
        id: semver
        run: |
          tag="${GITHUB_REF_NAME}"
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$tag" =~ $re ]]; then
            echo "::error::tag '$tag' is not a SemVer tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The same steps as the before hooks in .goreleaser.yaml, which the
      # goreleaser job skips.
      - name: Build the frontend (frozen lockfile, NFR-30)
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      # Not web-dist: the ci job uploads that name into the same run, built
      # with caches.
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: release-web-dist
          path: web/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: GoReleaser
    needs: [ci, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub release
      packages: write # push images to ghcr.io
      id-token: write # cosign keyless signing + attestations
      attestations: write # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # changelog needs full history and tags
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false # never restore a cache into a release build

      - name: Download the frontend build
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-web-dist
          path: web/dist

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # The build job ran the before hooks and built web/dist.
          args: release --clean --skip=before
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest provenance of release archives
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-checksums: dist/checksums.txt

      - name: Resolve image digest
        id: image
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ needs.build.outputs.version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest provenance of container image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      # GoReleaser created a draft (.goreleaser.yaml). Once published, an
      # immutable release keeps its tag and assets, so this runs last.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  scan-image:
    name: Container scan (Grype)
    needs: [build, goreleaser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify image signature
        run: |
          cosign verify "${IMAGE}:${{ needs.build.outputs.version }}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

      - name: Grype scan (SARIF)
        id: grype
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          output-format: sarif
          fail-build: false
          only-fixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      # Reuses the grype binary from the tool cache and the local DB.
      - name: Fail on critical/high vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          output-format: table
          severity-cutoff: high
          only-fixed: true
